# The dsh-headless bundle patch: one-shot task mode directly over dsh-base.
# It mounts no Host, HTTP server, Web runtime, or browser plugin. An ordinary
# provider plugin injects `cmdlineArgs`, parses the task positional
# (`dsh --profile headless "<task>"`), the `--session-name` / `--format`
# flags, and this app's --help; the direct driver then creates or resumes an
# Agent through the core registry and reports its durable result.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

# The shared module-reload HMR row stays off; the launcher's watch-only
# fallback still keeps the user patch layers live until the run exits.
- id: hmr
  disabled: true

- id: tools
  config:
    # Keep the same temporary process-wide Code Mode opt-in as the Web surface.
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    # Code Mode is a core execution capability, not a Web component.
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    - id: headless-startup
      name: '@deepseek-ai/dsh-headless/startup'

    # The mailbox seam and its local SQLite store back the mailbox tools: mail
    # sits in the shared deployment queue until the recipient drains it. The
    # bridge is deliberately NOT mounted here — a mail-enabled deployment adds
    # it in a later patch layer (the bridge pushes mail into live turns), and
    # without one the seat's own mailbox_check_inbox drain is the reader.
    - id: mailbox
      name: '@deepseek-ai/dsh-mailbox'
      config:
        defaultProvider: local

    - id: mailbox-local
      name: '@deepseek-ai/dsh-mailbox-local'

    # The trusted sender identity is the launcher-validated --session-name:
    # the row injects the startup service so its lazy config reads the name
    # after the command line is parsed, and the tools fail loud at call time
    # for an anonymous run that has none.
    - id: tool-mailbox
      name: '@deepseek-ai/dsh-tool-mailbox'
      inject: [headlessStartup]
      config:
        sessionName: !!js ctx.headlessStartup.sessionName

    # Reads its task and output flags from the ordinary headlessStartup provider.
    - id: headless-runner
      name: '@deepseek-ai/dsh-headless'
      inject: [headlessStartup]
      config:
        task: !!js ctx.headlessStartup.task
        sessionName: !!js ctx.headlessStartup.sessionName
        sessionId: !!js ctx.headlessStartup.sessionId
        format: !!js ctx.headlessStartup.format
