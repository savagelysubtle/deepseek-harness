# Opt-in rule-enforcement overlay (OP-180 Slice C). Mounts the Claude-dialect
# hook bridge with the control-plane gate scripts so a model running inside dsh
# is bound by the same plan / screenshot / done-evidence gates as a Claude Code
# session. Apply to a throwaway profile only:
#   dsh web --patch examples/hooks/gate-hooks.cordis.yml
# `configPath` is process-level and resolves from the launch cwd; the expression
# below defaults to this folder's settings file under the launch cwd (run from the
# repository root) and honours DSH_GATE_HOOKS_SETTINGS for any other location. The
# settings file expands `$HOME` in its commands (hook commands run through a shell).
# See README.md for what each gate does and its limits.
- insert:
    - id: gate-hooks
      name: '@deepseek-ai/dsh-hooks-claude-code'
      config:
        configPath: !!js >-
          process.env.DSH_GATE_HOOKS_SETTINGS?.trim() || process.getBuiltinModule('node:path').join(process.cwd(), 'examples/hooks/gate-hooks.settings.json')
